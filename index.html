</style></head><body>
<header><div><h1>Drawing Revision Review</h1><div id="sub">Upload Rev 1 and Rev 2 PDF drawings. Everything runs in your browser; nothing is stored.</div></div>
<div><button id="newb">New comparison</button><button id="csv">Export review (CSV)</button><button id="pr">Print report</button></div></header>
<div class="w" id="up"><div class="up"><label class="dz"><b style="color:#0b5ed7">Rev 1 drawing (old)</b><input type="file" id="f1" accept="application/pdf"></label>
<label class="dz"><b style="color:#d00000">Rev 2 drawing (new)</b><input type="file" id="f2" accept="application/pdf"></label></div>
<p><button class="pri" id="go">Compare &amp; open review</button> <span id="st" style="color:var(--mut)"></span></p></div>
<div class="w" id="dash" hidden>
<div class="stats" id="stats"></div>
<div class="chips"><span id="chips"></span><input id="q" placeholder="Search…"></div>
<div class="work"><div class="vw"><div class="tb"><button data-m="2" class="on">Rev 2 (new)</button><button data-m="1">Rev 1 (old)</button><button data-m="cmp">Compare slider</button>
<select id="pgs" hidden></select><span class="sp">scroll = zoom, drag = move</span><button id="zo">−</button><button id="zi">+</button><button id="zf">Fit</button></div>
<div class="vp" id="vp"><div class="inner" id="inner"></div></div></div><div class="list" id="list"></div></div></div>
<div id="rep"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='libs/pdf.worker.min.js';
const S=1.5,G=4,$=id=>document.getElementById(id);
const st=t=>$('st').textContent=t,tick=()=>new Promise(r=>setTimeout(r,15));
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function el(h){const t=document.createElement('div');t.innerHTML=h;return t.firstElementChild}
async function loadPages(f){
 const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];
 for(let i=1;i<=pdf.numPages;i++){
  const p=await pdf.getPage(i),vp=p.getViewport({scale:S}),c=document.createElement('canvas');
  c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
  const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await p.render({canvasContext:x,viewport:vp}).promise;
  const tc=await p.getTextContent(),items=[];
  for(const t of tc.items){const s=t.str.trim();if(!s)continue;
   const m=pdfjsLib.Util.transform(vp.transform,t.transform),sx=Math.hypot(m[0],m[1])||1,w=t.width*S;
   const px=[m[4],m[4]+w*m[0]/sx,m[4]+m[2],m[4]+w*m[0]/sx+m[2]],py=[m[5],m[5]+w*m[1]/sx,m[5]+m[3],m[5]+w*m[1]/sx+m[3]];
   const x0=Math.min(...px),y0=Math.min(...py);items.push({s,x:x0,y:y0,w:Math.max(...px)-x0,h:Math.max(...py)-y0})}
  out.push({c,items})}
 return out}
function dark(c,W,H){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,m=new Uint8Array(W*H),w=c.width;
 for(let y=0;y<c.height;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(d[i]+d[i+1]+d[i+2]<540)m[y*W+x]=1}return m}
function dil(m,W,H,r){const t=new Uint8Array(m.length),o=new Uint8Array(m.length);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(m[y*W+x]){const a=Math.max(0,x-r),b=Math.min(W-1,x+r);for(let k=a;k<=b;k++)t[y*W+k]=1}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(t[y*W+x]){const a=Math.max(0,y-r),b=Math.min(H-1,y+r);for(let k=a;k<=b;k++)o[k*W+x]=1}
 return o}
const unm=(A,B)=>A.filter(t=>!B.some(u=>u.s===t.s&&Math.abs(u.x-t.x)<8&&Math.abs(u.y-t.y)<8));
const hit=(t,b)=>t.x<b.x+b.w&&t.x+t.w>b.x&&t.y<b.y+b.h&&t.y+t.h>b.y;
const isDim=s=>/\d/.test(s)&&/^[\sØ⌀φΦ()+\-±\d.,xR×°]*$/.test(s);
function cmp(a,b){
 const W=Math.max(a.c.width,b.c.width),H=Math.max(a.c.height,b.c.height),m1=dark(a.c,W,H),m2=dark(b.c,W,H),d1=dil(m1,W,H,2),d2=dil(m2,W,H,2);
 const ov=document.createElement('canvas');ov.width=W;ov.height=H;const ox=ov.getContext('2d'),id=ox.createImageData(W,H),p=id.data;
 const gw=Math.ceil(W/G),gh=Math.ceil(H/G),cell=new Uint8Array(gw*gh),N1=new Uint16Array(gw*gh),N2=new Uint16Array(gw*gh);
 for(let i=0;i<W*H;i++){let r=255,g=255,bl=255;const q=((i/W|0)/G|0)*gw+((i%W)/G|0);
  if(m1[i]&&!d2[i]){r=0;g=90;bl=200;cell[q]=1;N1[q]++}else if(m2[i]&&!d1[i]){r=215;g=0;bl=0;cell[q]=1;N2[q]++}else if(m1[i]||m2[i]){r=g=bl=150}
  p[i*4]=r;p[i*4+1]=g;p[i*4+2]=bl;p[i*4+3]=255}
 ox.putImageData(id,0,0);
 const dc=dil(cell,gw,gh,3),lab=new Uint8Array(gw*gh),boxes=[];
 for(let s=0;s<dc.length;s++){if(!dc[s]||lab[s])continue;const stk=[s];lab[s]=1;let x0=1e9,y0=1e9,x1=-1,y1=-1,n1=0,n2=0;
  while(stk.length){const c=stk.pop(),cx=c%gw,cy=(c/gw)|0;
   if(cell[c]){x0=Math.min(x0,cx);y0=Math.min(y0,cy);x1=Math.max(x1,cx);y1=Math.max(y1,cy);n1+=N1[c];n2+=N2[c]}
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=gw||ny>=gh)continue;const q=ny*gw+nx;if(dc[q]&&!lab[q]){lab[q]=1;stk.push(q)}}}
  if(x1>=0&&n1+n2>=10)boxes.push({x:x0*G-5,y:y0*G-5,w:(x1-x0+1)*G+10,h:(y1-y0+1)*G+10,n1,n2})}
 boxes.sort((u,v)=>u.y-v.y||u.x-v.x);
 const u1=unm(a.items,b.items),u2=unm(b.items,a.items),ds=[];
 for(const bx of boxes){
  const j=U=>U.filter(t=>hit(t,bx)).sort((p,q)=>p.x-q.x||p.y-q.y).map(t=>t.s).join(' ');
  const t1=j(u1),t2=j(u2);let remark,type,r1,r2;
  if(t1||t2){type=isDim(t1||t2)?'DIMENSION':'TEXT';r1=t1||'(not present)';r2=t2||'(not present)';
   remark=t1&&t2?'CHANGED (Rev 1 → Rev 2)':t2?'ADDED in Rev 2':'REMOVED from Rev 1'}
  else{type='GRAPHIC';const k=bx.n1>4*bx.n2?1:bx.n2>4*bx.n1?2:0;
   remark=k==2?'ADDED in Rev 2':k==1?'REMOVED from Rev 1':'CHANGED (Rev 1 → Rev 2)';
   r1=k==2?'(not present)':'Geometry';r2=k==1?'(not present)':'Geometry'}
  ds.push({box:bx,type,r1,r2,remark})}
 return{ds,ov,W,H,a,b}}
const kind=d=>d.remark[0]=='C'?'Changed':d.remark[0]=='A'?'Added':'Removed';
function title(d){const k=kind(d);if(d.type=='GRAPHIC')return 'Drawing lines '+k.toLowerCase()+(d.near?' near “'+d.near+'”':'');
 return k=='Added'?'+ '+d.r2:k=='Removed'?'− '+d.r1:d.r1+' → '+d.r2}
function crop(src,W,H,d,rev,col){
 const b=d.box,cw=Math.min(W,Math.max(b.w+160,340)),ch=Math.min(H,Math.max(b.h+100,190));
 const sx=Math.max(0,Math.min(W-cw,b.x+b.w/2-cw/2)),sy=Math.max(0,Math.min(H-ch,b.y+b.h/2-ch/2));
 const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);
 x.drawImage(src,sx,sy,cw,ch,0,0,cw,ch);
 const pres=rev==1?kind(d)!='Added':kind(d)!='Removed';
 x.lineWidth=3;x.strokeStyle=col;x.setLineDash(pres?[]:[8,5]);if(pres){x.fillStyle=col+'33';x.fillRect(b.x-sx,b.y-sy,b.w,b.h)}x.strokeRect(b.x-sx,b.y-sy,b.w,b.h);return c}
function mark(src,W,H,ds,rev,col){
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(src,0,0);
 for(const d of ds){const b=d.box,pres=rev==1?kind(d)!='Added':rev==2?kind(d)!='Removed':true;
  x.lineWidth=3;x.strokeStyle=col;x.setLineDash(pres?[]:[8,5]);if(pres){x.fillStyle=col+'33';x.fillRect(b.x,b.y,b.w,b.h)}x.strokeRect(b.x,b.y,b.w,b.h);x.setLineDash([]);
  x.fillStyle=col;x.beginPath();x.arc(b.x,b.y,13,0,7);x.fill();x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(d.n,b.x,b.y+1)}
 c.className='big';return c}
/* ---------- dashboard ---------- */
let res=[],all=[],cur=0,mode='2',view={s:1,x:0,y:0},sel=null,F={t:new Set(),k:new Set(),q:''},names=['',''],cmpP=50,moved=false;
const vp=$('vp'),inner=$('inner');
const applyView=()=>{inner.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;inner.style.setProperty('--s',view.s)};
function fit(){const r=res[cur],w=vp.clientWidth,h=vp.clientHeight,s=Math.min(w/r.W,h/r.H);view={s,x:(w-r.W*s)/2,y:(h-r.H*s)/2};applyView()}
function zoom(f,px=vp.clientWidth/2,py=vp.clientHeight/2){const s=Math.max(.05,Math.min(14,view.s*f)),k=s/view.s;view={s,x:px-(px-view.x)*k,y:py-(py-view.y)*k};applyView()}
const vis=d=>(!F.t.size||F.t.has(d.cat))&&(!F.k.size||F.k.has(kind(d)))&&(!F.q||(d.n+' '+title(d)+' '+d.r1+' '+d.r2+' '+d.near+' '+d.loc).toLowerCase().includes(F.q));
function stats(){const c=k=>all.filter(d=>kind(d)==k).length,rv=all.filter(d=>d.rv!='Pending').length;
 $('stats').innerHTML=`<div class="stat"><b>${all.length}</b>changes found</div><div class="stat"><b style="color:#d98a00">${c('Changed')}</b>changed</div><div class="stat"><b style="color:#1a7f37">${c('Added')}</b>added in Rev 2</div><div class="stat"><b style="color:#c0392b">${c('Removed')}</b>removed from Rev 1</div><div class="stat wide"><b>${rv} / ${all.length}</b>reviewed<div class="pb"><i style="width:${all.length?rv/all.length*100:0}%"></i></div></div>`}
function chips(){$('chips').innerHTML=['Dimension','Text / note','Geometry','Title block'].map(c=>`<button class="chip${F.t.has(c)?' on':''}" data-t="${c}">${c} <b>${all.filter(d=>d.cat==c).length}</b></button>`).join('')+'<span>|</span>'+['Changed','Added','Removed'].map(k=>`<button class="chip${F.k.has(k)?' on':''}" data-k="${k}">${k}</button>`).join('')}
function drawViewer(){
 const r=res[cur];inner.innerHTML='';inner.style.width=r.W+'px';inner.style.height=r.H+'px';
 const add=c=>{c.style.cssText='position:absolute;left:0;top:0;pointer-events:none';inner.appendChild(c);return c};
 if(mode=='1')add(r.a.c);else if(mode=='2')add(r.b.c);else{add(r.a.c);const t=add(r.b.c);t.style.clipPath=`inset(0 0 0 ${cmpP}%)`;
  const sl=el('<div class="sl"></div>');sl.style.left=cmpP+'%';
  sl.onpointerdown=e=>{e.stopPropagation();sl.setPointerCapture(e.pointerId);sl.onpointermove=ev=>{const rc=inner.getBoundingClientRect();cmpP=Math.max(0,Math.min(100,(ev.clientX-rc.left)/rc.width*100));sl.style.left=cmpP+'%';t.style.clipPath=`inset(0 0 0 ${cmpP}%)`};sl.onpointerup=()=>sl.onpointermove=null};
  inner.appendChild(sl)}
 for(const d of r.ds.filter(vis)){const b=d.box,x=el(`<div class="bx ${kind(d)[0]}${d.n==sel?' sel':''}" data-n="${d.n}" title="#${d.n}"><span class="bn">${d.n}</span></div>`);
  x.style.cssText=`left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`;x.onclick=()=>{if(!moved)select(d.n)};inner.appendChild(x)}
 document.querySelectorAll('.tb [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));applyView()}
function renderList(){const L=$('list');L.innerHTML='';const v=all.filter(vis);if(!v.length)L.innerHTML='<div class="cd">No matching changes.</div>';
 for(const d of v){const c=el(`<div class="cd ${kind(d)[0]}${d.n==sel?' sel':''}"><div class="ch"><span class="nb">${d.n}</span><span>${esc(title(d))}</span></div><div class="sub">${kind(d)} · ${d.loc}${d.page>1||res.length>1?' · page '+d.page:''}${d.rv!='Pending'?' · '+d.rv:''}</div></div>`);
  c.querySelector('.ch').onclick=c.querySelector('.sub').onclick=()=>select(d.n==sel?null:d.n);
  if(d.n==sel){const r=res[d.page-1],dt=el('<div><div class="two"><div><div class="lb b1">Rev 1</div></div><div><div class="lb b2">Rev 2</div></div></div><div class="rv"><select><option>Pending</option><option>Approved</option><option>Rejected</option><option>Query</option></select><textarea rows="2" placeholder="Comment…"></textarea></div></div>'),cs=dt.querySelectorAll('.two>div');
   cs[0].appendChild(crop(r.a.c,r.W,r.H,d,1,'#0b5ed7'));cs[1].appendChild(crop(r.b.c,r.W,r.H,d,2,'#d00000'));
   const se=dt.querySelector('select'),ta=dt.querySelector('textarea');se.value=d.rv;se.onchange=()=>{d.rv=se.value;stats();renderList()};ta.value=d.comment;ta.oninput=()=>d.comment=ta.value;c.appendChild(dt)}
  L.appendChild(c)}}
function select(n){sel=n;const d=all.find(x=>x.n==n);
 if(d&&d.page-1!=cur){cur=d.page-1;$('pgs').value=cur;drawViewer()}
 inner.querySelectorAll('.bx').forEach(b=>b.classList.toggle('sel',b.dataset.n==n));renderList();
 if(d){const b=d.box,w=vp.clientWidth,h=vp.clientHeight,r=res[cur],s=Math.max(Math.min(w/(b.w+400),h/(b.h+400),4),Math.min(w/r.W,h/r.H));view={s,x:w/2-(b.x+b.w/2)*s,y:h/2-(b.y+b.h/2)*s};applyView()}
 document.querySelector('.cd.sel')?.scrollIntoView({block:'nearest'})}
function refresh(){chips();renderList();drawViewer()}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const[S_,v]=b.dataset.t?[F.t,b.dataset.t]:[F.k,b.dataset.k];S_.has(v)?S_.delete(v):S_.add(v);refresh()};
$('q').oninput=e=>{F.q=e.target.value.toLowerCase();renderList();drawViewer()};
document.querySelectorAll('.tb [data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;drawViewer()});
$('zi').onclick=()=>zoom(1.3);$('zo').onclick=()=>zoom(1/1.3);$('zf').onclick=fit;
$('pgs').onchange=e=>{cur=+e.target.value;drawViewer();fit()};
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
vp.onpointerdown=e=>{moved=false;const sx=e.clientX,sy=e.clientY,ox=view.x,oy=view.y;vp.style.cursor='grabbing';
 vp.onpointermove=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>4)moved=true;if(moved){view.x=ox+ev.clientX-sx;view.y=oy+ev.clientY-sy;applyView()}};
 vp.onpointerup=()=>{vp.onpointermove=null;vp.style.cursor='grab';setTimeout(()=>moved=false,0)}};
addEventListener('resize',()=>res.length&&!$('dash').hidden&&fit());
/* ---------- run ---------- */
async function run(){
 const f1=$('f1').files[0],f2=$('f2').files[0];if(!f1||!f2){st('Please choose both PDF files.');return}
 $('go').disabled=true;
 try{st('Reading Rev 1…');await tick();const A=await loadPages(f1);st('Reading Rev 2…');await tick();const B=await loadPages(f2);
  const n=Math.min(A.length,B.length);res=[];all=[];let k=0;sel=null;cur=0;F={t:new Set(),k:new Set(),q:''};$('q').value='';names=[f1.name,f2.name];
  for(let i=0;i<n;i++){st('Comparing page '+(i+1)+' of '+n+'…');await tick();const r=cmp(A[i],B[i]);
   for(const d of r.ds){const b=d.box,cx=b.x+b.w/2,cy=b.y+b.h/2;d.n=++k;d.page=i+1;d.rv='Pending';d.comment='';
    const row=cy<r.H/3?'top':cy<2*r.H/3?'centre':'bottom',col=cx<r.W/3?'left':cx<2*r.W/3?'centre':'right';
    d.loc=row=='centre'&&col=='centre'?'centre':row+' '+col;
    d.cat=cx>.7*r.W&&cy>.88*r.H?'Title block':d.type=='DIMENSION'?'Dimension':d.type=='TEXT'?'Text / note':'Geometry';
    let best='',bd=1e12;for(const t of[...A[i].items,...B[i].items]){const dd=(t.x+t.w/2-cx)**2+(t.y+t.h/2-cy)**2;if(dd<bd){bd=dd;best=t.s}}d.near=best.slice(0,24);all.push(d)}
   res.push(r)}
  $('sub').textContent=`${f1.name} → ${f2.name} | generated ${new Date().toLocaleString()}`+(A.length!=B.length?` | page counts differ (${A.length} vs ${B.length}), first ${n} compared`:'');
  $('pgs').hidden=n<2;$('pgs').innerHTML=res.map((_,i)=>`<option value="${i}">Page ${i+1}</option>`).join('');
  $('up').hidden=true;$('dash').hidden=false;stats();refresh();fit();st('')
 }catch(e){console.error(e);st('Error: '+e.message)}
 $('go').disabled=false}
$('go').onclick=run;
$('newb').onclick=()=>{$('dash').hidden=true;$('up').hidden=false};
$('csv').onclick=()=>{if(!all.length)return;const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=[['#','Page','Category','Change','Rev 1','Rev 2','Location','Review','Comment'],...all.map(d=>[d.n,d.page,d.cat,kind(d),d.r1,d.r2,d.loc,d.rv,d.comment])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='drawing-review.csv';a.click()}
/* ---------- printable report ---------- */
function buildReport(){
 const rep=$('rep');rep.innerHTML='';const sh=el('<div class="sheet"></div>');rep.appendChild(sh);const cnt=x=>all.filter(d=>kind(d)==x).length;
 const nP=res.length,rvd=all.filter(d=>d.rv!='Pending').length;
 sh.appendChild(el(`<div class="pg cover"><div class="gen">Generated ${new Date().toLocaleString()} &nbsp;|&nbsp; Rev 1: ${esc(names[0])} &nbsp;|&nbsp; Rev 2: ${esc(names[1])}</div>
 <div class="gen">Drawings compared: ${esc(names[0])} &rarr; ${esc(names[1])} (${nP} page${nP>1?'s':''}) &nbsp;|&nbsp; Reviewed: ${rvd} of ${all.length}</div>
 <div class="n14${all.length?'':' ok'}">${all.length?all.length+' difference(s) found':'No differences found'}</div>
 <div class="cts"><span>${cnt('Changed')} changed</span><span>${cnt('Added')} added in Rev 2</span><span>${cnt('Removed')} removed from Rev 1</span></div>
 <h3>How to read this PDF</h3><ol><li>Difference list (next page): every difference with its Rev 1 value, Rev 2 value, remark and review status.</li>
 <li>Overview of the Rev 2 drawing: every difference is boxed in RED and numbered.</li>
 <li>Overview of the Rev 1 drawing: the same numbers in BLUE show where each item was (dashed = not present).</li>
 <li>Difference details: zoomed Rev 1 and Rev 2 views of each numbered difference, side by side.</li>
 <li>Overlay: both drawings on top of each other (BLUE = only in Rev 1, RED = only in Rev 2, gray = same).</li></ol>
 <h3>Colour key</h3>
 <div class="kr" style="color:#d00000"><span class="sw" style="border-color:#d00000;background:#f5c0c0"></span>RED = difference on Rev 2 (new / changed value)</div>
 <div class="kr" style="color:#0b5ed7"><span class="sw" style="border-color:#0b5ed7;background:#bfd4f2"></span>BLUE = same spot on Rev 1 (old value / where it was)</div>
 <div style="font-size:14px;margin-top:10px">Remark meanings: &nbsp;ADDED = only in Rev 2 &nbsp;|&nbsp; REMOVED = only in Rev 1 &nbsp;|&nbsp; CHANGED = same place, different value</div></div>`));
 const rows=res.map((r,i)=>r.ds.length?`<tr class="gr"><td colspan="7">${esc(names[1])} &nbsp;-&nbsp; page ${i+1}</td></tr>`+r.ds.map(d=>`<tr class="k${kind(d)[0]}"><td>${d.n}</td><td>${d.page}</td><td class="tp">${d.type}</td><td>${esc(d.r1)}</td><td>${esc(d.r2)}</td><td class="tp">${d.remark}</td><td>${d.rv}${d.comment?': '+esc(d.comment):''}</td></tr>`).join(''):'').join('');
 sh.appendChild(el(`<div class="pg"><h2 class="dlh">Difference list</h2><table class="dl"><thead><tr><th>#</th><th>Page</th><th>Type</th><th>Rev 1</th><th>Rev 2</th><th>Remark</th><th>Review</th></tr></thead><tbody>${rows||'<tr><td colspan="7">No differences found.</td></tr>'}</tbody></table></div>`));
 res.forEach((r,i)=>{const{ds,ov,W,H}=r,pn=' – page '+(i+1);let q;
  q=el(`<div class="pg"><div class="bar" style="background:#d00000">REV 2 drawing – ${ds.length} difference(s) in RED${pn}</div></div>`);q.appendChild(mark(r.b.c,W,H,ds,2,'#d00000'));sh.appendChild(q);
  q=el(`<div class="pg"><div class="bar" style="background:#0b5ed7">REV 1 drawing – same spots in BLUE${pn}</div></div>`);q.appendChild(mark(r.a.c,W,H,ds,1,'#0b5ed7'));sh.appendChild(q);
  for(let s=0;s<ds.length;s+=6){q=el(`<div class="pg"><h2 style="font-size:16px">Difference details${pn}</h2><div class="grid"></div></div>`);
   for(const d of ds.slice(s,s+6)){const c=el(`<div class="card"><div class="hd">#${d.n} ${d.type} – ${d.remark}</div><div class="vl">Rev 1: ${esc(d.r1)} &nbsp; Rev 2: ${esc(d.r2)}</div><div class="two"><div></div><div></div></div></div>`),cs=c.querySelectorAll('.two>div');
    cs[0].appendChild(crop(r.a.c,W,H,d,1,'#0b5ed7'));cs[1].appendChild(crop(r.b.c,W,H,d,2,'#d00000'));q.querySelector('.grid').appendChild(c)}sh.appendChild(q)}
  q=el(`<div class="pg"><div class="bar" style="background:#1d4e7a">Overlay – BLUE only Rev 1, RED only Rev 2, gray same${pn}</div></div>`);q.appendChild(mark(ov,W,H,ds,0,'#000'));sh.appendChild(q)})}
$('pr').onclick=()=>{if(!res.length)return;buildReport();window.print()};
</script></body></html>
